<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trạm học tập · Wireframe v3 "Focus Grid"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Wireframe v3 "Focus Grid".
   Tokens from UI/UX Pro Max: style "Minimalism & Swiss" + "Data-Dense Dashboard",
   palette "Timer & Pomodoro" (focus red, break green) on neutral slate,
   font pairing "Dashboard Data" (Fira Sans + Fira Code). */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --soft:#F1F5F9; --soft2:#E2E8F0;
  --ink:#0F172A; --muted:#475569; --line:#CBD5E1; --line-strong:#94A3B8;
  --accent:#DC2626; --accent-dark:#B91C1C; --on-accent:#FFFFFF; --accent-soft:#FEF2F2;
  --ok:#047857; --ok-soft:#ECFDF5;
  --r:10px; --r-sm:6px;
  --sans:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Fira Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
h1,h2,h3,p{margin:0}
a{color:inherit}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:600 15px/1 var(--sans);text-decoration:none;cursor:pointer;transition:background-color .15s ease}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{border-color:transparent;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 7px;border:1px dashed var(--line-strong);border-radius:4px;font:500 12px/1.4 var(--mono);color:var(--muted);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;flex-wrap:wrap}
.seg>*{min-height:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:0;border-right:1px solid var(--line);font:500 14px/1.2 var(--sans);color:var(--ink);text-decoration:none;cursor:pointer;flex:1 1 auto;text-align:center}
.seg>*:last-child{border-right:0}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--ink);color:#fff;font-weight:600}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.lab{font-weight:600;font-size:14px}
.input{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card);color:var(--muted);font-size:15px}
.input.filled{color:var(--ink)}
.input .ico{color:var(--muted)}
.help{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.box{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:13px;line-height:1;flex:none}
.switch{width:46px;height:26px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink)}
.switch.on{background:var(--ink)}
.switch.on::after{left:auto;right:3px;background:#fff}
.slider{padding:14px 0;border-bottom:1px solid var(--soft2)}
.slider:last-of-type{border-bottom:0}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slider .val{font:600 18px/1 var(--mono)}
.track{position:relative;height:6px;border-radius:3px;background:var(--soft2);margin:16px 9px 8px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ink)}
.track b{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--soft2)}
.setrow:last-child{border-bottom:0}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--soft);font-size:14px;color:var(--muted)}
.note .ico{width:18px;height:18px;margin-top:2px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-sm);border:1px solid var(--accent);border-left-width:4px;background:var(--accent-soft);font-size:14px}
.alert .ico{color:var(--accent-dark);margin-top:1px}
.code{display:block;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--soft);font:500 13px/1.5 var(--mono);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;background:var(--card);font-size:14px;color:var(--ink)}

/* ---------- app shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px;gap:20px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-sm);text-decoration:none;font-weight:500;color:var(--muted)}
.nav a:hover{background:var(--soft)}
.nav a[aria-current=page]{background:var(--ink);color:#fff;font-weight:600}
.tele{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tele h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.tele dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 8px;font-size:14px}
.tele dt{color:var(--muted)} .tele dd{margin:0;font-weight:600;text-align:right}
.me{display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{margin-left:248px;padding:28px 32px 40px;max-width:1440px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:26px;line-height:1.2}
.appbar,.tabbar{display:none}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2{font-size:16px;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.push{margin-top:auto}

/* ---------- widgets ---------- */
.clock{font:600 72px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:20px;font-weight:500;color:var(--muted);letter-spacing:0}
.bar{height:10px;border-radius:5px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rounds{display:flex;gap:6px;align-items:center}
.rounds i{width:22px;height:8px;border-radius:4px;background:var(--soft2)}
.rounds i.done{background:var(--ink)} .rounds i.now{background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1}
.tile{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:6px;min-width:0;align-content:start}
.tile .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.tile .v{font:600 28px/1.1 var(--mono)}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}
.spark{width:100%;height:36px;display:block}
.meter{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;position:relative;margin-top:4px}
.meter i{height:12px;border-radius:2px;background:var(--soft2)}
.meter i.on{background:var(--ink)}
.meter::after{content:"";position:absolute;left:29.3%;top:-4px;bottom:-4px;border-left:2px dashed var(--accent)}
.lcd{background:#E7ECDD;border:2px solid var(--ink);border-radius:var(--r-sm);padding:12px;display:grid;gap:4px;justify-content:center}
.lcd div{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.lcd span{width:18px;height:26px;background:#D5DCC6;display:grid;place-items:center;font:500 15px/1 var(--mono);color:#1F2A14}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:var(--r-sm);background:var(--soft)}
.stat b{display:block;font:600 22px/1.2 var(--mono)}
.stat span{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bars .b i{width:100%;border-radius:3px 3px 0 0;background:var(--line-strong)}
.bars .b.hi i{background:var(--accent)}
.bars .b span{font-size:12px;color:var(--muted);height:16px;white-space:nowrap}
.bars.tall{height:170px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2.5px dashed var(--ink)}
.legend i.sq{width:12px;height:12px;border:0;border-radius:2px;background:var(--accent)}
.chart{position:relative;border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);background:repeating-linear-gradient(to bottom,transparent 0 24.5%,var(--soft2) 24.5% 25%)}
.chart svg{display:block;width:100%;height:200px}
.xaxis{display:flex;justify-content:space-between;font:400 12px/1 var(--mono);color:var(--muted);margin-top:6px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{aspect-ratio:1.5;border-radius:4px;display:grid;place-items:center;font:500 12px/1 var(--mono)}
.heat .hd{aspect-ratio:auto;color:var(--muted);font-family:var(--sans);padding-bottom:2px}
.l0{background:var(--soft);color:var(--muted)}.l1{background:#CBD5E1}.l2{background:#94A3B8}.l3{background:#475569;color:#fff}.l4{background:#0F172A;color:#fff}
.scale{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.scale i{width:16px;height:12px;border-radius:2px}
.kpi b{font:600 32px/1.1 var(--mono)}
.kpi b small{font-size:15px;font-weight:500;color:var(--muted)}
.kv{display:grid;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft2);font-size:15px}
.kv>div:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--soft2);vertical-align:top}
tr:last-child td{border-bottom:0}
.rate{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--soft2)}
.rate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate-btn{display:grid;justify-items:center;gap:6px;min-height:72px;padding:10px 4px;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:600 14px/1.2 var(--sans);text-align:center;cursor:pointer;transition:background-color .15s ease}
.rate-btn:hover{background:var(--soft)}
.rate-btn .ico{width:26px;height:26px}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strength i{height:6px;border-radius:3px;background:var(--soft2)} .strength i.on{background:var(--ink)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth-in{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;max-width:1180px;width:100%;margin:0 auto;padding:48px 40px}
.hero{display:grid;gap:24px}
.hero h1{font-size:40px;line-height:1.15;letter-spacing:-.01em}
.hero .clock{font-size:112px}
.cycle{display:flex;gap:3px}
.cycle i{height:26px;border-radius:3px;background:var(--ink)}
.cycle i.brk{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--card) 3px 6px);border:1px solid var(--line-strong)}
.cycle i.long{background:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:0;padding:0}
.steps li{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--card);font-size:14px}
.steps b{display:block;font:600 13px/1 var(--mono);color:var(--accent-dark);margin-bottom:6px}
.form{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:32px}
.form h2{font-size:24px;margin-bottom:4px}
.form .seg{width:100%;margin:20px 0}
.foot{border-top:1px solid var(--line);background:var(--card);padding:14px 40px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.foot b{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}

/* ---------- tablet: icon rail ---------- */
@media (max-width:1100px){
  .side{width:88px;padding:20px 12px;align-items:center}
  .side .lbl,.tele,.me .who{display:none}
  .nav{width:100%}.nav a{justify-content:center;padding:0;min-height:52px}
  .me{margin-top:auto;border-top:0}
  .main{margin-left:88px;padding:24px}
  .t6{grid-column:span 6}.t12{grid-column:span 12}
  .auth-in{gap:32px;padding:32px 24px}
  .hero .clock{font-size:88px}
}
/* ---------- phone: one column, bottom tabs ---------- */
@media (max-width:760px){
  .side{display:none}
  .appbar{display:flex;position:sticky;top:0;z-index:5;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .appbar strong{font-size:17px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0 0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current=page]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
  .main{margin:0;padding:16px 16px 88px}
  .top h1{display:none}.top{margin-bottom:12px}
  .grid{gap:12px}
  .grid>*{grid-column:span 12}
  .grid>.m6{grid-column:span 6}
  .card{padding:16px}
  .clock{font-size:60px}
  .tiles{grid-template-columns:1fr 1fr}.tiles .wide{grid-column:span 2}
  .lcd span{width:16px;height:24px;font-size:14px}
  .lcd{padding:10px 6px}
  .btn.mfull{width:100%}
  .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .seg.three{grid-template-columns:repeat(3,1fr)}
  .seg>*{border-bottom:1px solid var(--line)}
  table.stack thead{display:none}
  table.stack tr{display:block;padding:10px 0;border-bottom:1px solid var(--soft2)}
  table.stack tr:last-child{border-bottom:0}
  table.stack td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;flex:none}
  .auth-in{grid-template-columns:1fr;gap:24px;padding:20px 16px}
  .hero{order:2;gap:16px}.hero h1{font-size:24px}.hero .clock{font-size:64px}
  .steps{grid-template-columns:1fr}
  .form{padding:20px}
  .foot{padding:12px 16px;gap:8px 16px;justify-content:flex-start}
  .savebar{position:sticky;bottom:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Static wireframe: every number is sample data. Open with ?screen=<name>[&tab=<name>].
const q = new URLSearchParams(location.search);
const SCREEN = q.get('screen') || 'tong-quan';
const TAB = q.get('tab') || 'pomodoro';
const STATE = q.get('state') || '';   // "danh-gia": the session has just ended and the one-tap rating is showing

const P = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  history:'<path d="M5 20V10M11 20V4M17 20v-8M2 20h20"/>',
  settings:'<path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
  temp:'<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  send:'<path d="M4 12l16-8-6 16-3-7z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  warn:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',
  logout:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
  save:'<path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/>',
  faceLow:'<circle cx="12" cy="12" r="9"/><path d="M8 16s1.5-2 4-2 4 2 4 2M9 9.5h.01M15 9.5h.01"/>',
  faceMid:'<circle cx="12" cy="12" r="9"/><path d="M8 15h8M9 9.5h.01M15 9.5h.01"/>',
  faceHigh:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const LOGO = ico("timer");
const tags = (...t) => `<span class="meta">${t.map(x => `<span class="tag">${x}</span>`).join('')}</span>`;
const card = (cls, title, meta, body) => `<section class="card ${cls}"><header><h2>${title}</h2>${meta}</header>${body}</section>`;
const NAV = [['tong-quan','Tổng quan','home'],['phien-hoc','Phiên học','timer'],['lich-su','Lịch sử','history'],['cai-dat','Cài đặt','settings']];
const link = (s, extra = '') => `?screen=${s}${extra}`;

function spark(vals){
  const min = Math.min(...vals), max = Math.max(...vals), n = vals.length - 1;
  const pts = vals.map((v, i) => `${(i / n * 100).toFixed(1)},${(30 - (v - min) / (max - min || 1) * 26).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" role="img" aria-label="Xu hướng 1 giờ"><polyline points="${pts}" fill="none" stroke="#0F172A" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(data, opt = {}){
  const max = Math.max(...data.map(d => d[1]));
  return `<div class="bars ${opt.cls || ''}" role="img" aria-label="${opt.label || ''}">` + data.map(d =>
    `<div class="b ${d[2] ? 'hi' : ''}"><i style="height:${Math.max(3, d[1] / max * 100)}%"></i><span>${d[0]}</span></div>`).join('') + '</div>';
}
function lcd(text){
  const rows = [text.slice(0, 16).padEnd(16), text.slice(16, 32).padEnd(16)];
  return `<div class="lcd" role="img" aria-label="LCD 16x2: ${text}">` + rows.map(r => '<div>' + [...r].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('') + '</div>').join('') + '</div>';
}
function slider(label, val, unit, min, max, hint){
  const pct = (val - min) / (max - min) * 100;
  return `<div class="slider"><div class="top"><div><div class="lab">${label}</div>${hint ? `<div class="help">${hint}</div>` : ''}</div><span class="val">${val}<span class="small muted"> ${unit}</span></span></div>
  <div class="track" role="slider" aria-label="${label}" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${val}" tabindex="0"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
  <div class="ends"><span>${min}</span><span>${max}</span></div></div>`;
}
const setrow = (title, help, on) => `<div class="setrow"><div><div class="lab">${title}</div><div class="help">${help}</div></div><span class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${!!on}" aria-label="${title}" tabindex="0"></span></div>`;

  ${card('s4 t12', 'Điều kiện học tốt nhất', tags('grp_ai_insights', 'ID 13'), `
    <div class="kv"><div><span class="muted">Khung giờ vàng</span><b>19:00 – 22:00</b></div><div><span class="muted">Nhiệt độ</span><b>26 – 28 °C</b></div><div><span class="muted">Độ ẩm</span><b>60 – 70 %</b></div><div><span class="muted">Ánh sáng</span><b>Đủ sáng</b></div><div><span class="muted">Tỷ lệ hoàn thành dự đoán</span><b>91 %</b></div></div>
    <div class="note push">${ico('info')}<span>Gợi ý từ mô hình phân tích trên 30 ngày dữ liệu của bạn.</span></div>`)}
  ${card('s12', 'Các phiên học', tags('grp_sessions_table'), `

    ${rows.map(r => `<tr><td data-l="Ngày" class="mono">${r[0]}</td><td data-l="Thời gian" class="mono">${r[1]}</td><td data-l="Số vòng" class="mono">${r[2]}</td><td data-l="Mã thẻ" class="mono">${r[3]}</td><td data-l="Nhiệt độ TB" class="mono">${r[4]}</td><td data-l="Ánh sáng">${r[5]}</td><td data-l="Đánh giá">${r[6]}</td></tr>`).join('')}
    </tbody></table>`)}
  </div>`;
  return shell('lich-su', 'Lịch sử', 'Thói quen học, môi trường phòng và gợi ý từ mô hình', tools, body);
}

const SCREENS = {'dang-nhap':() => auth(false), 'dang-ky':() => auth(true), 'tong-quan':overview, 'phien-hoc':session, 'lich-su':history, 'cai-dat':settings};
// The two blocks below exist only for capture.ps1 (full-page screenshots).
const FRAME_W = +q.get('w');
if (FRAME_W) {
  // Headless Edge cannot open a window narrower than ~500 px, so phone shots load the
  // page inside an iframe of the wanted width; the script crops the picture afterwards.
  const minH = +q.get('minh') || 0;
  q.delete('w'); q.delete('minh');
  document.body.style.background = '#fff';
  document.getElementById('app').innerHTML = `<iframe title="Wireframe" src="${location.pathname.split('/').pop()}?${q}" style="display:block;border:0;width:${FRAME_W}px;height:${minH || 100}px"></iframe>`;
  addEventListener('message', e => {
    const h = Math.max(minH, +e.data.h || 0);
    document.querySelector('iframe').style.height = h + 'px';
    document.documentElement.dataset.h = h;
  });
} else {
  document.getElementById('app').innerHTML = (SCREENS[SCREEN] || overview)();
  const mark = () => {
    // Measure the content, not the viewport, so min-height:100vh screens report their real height.
    const el = document.querySelector('.main') || document.querySelector('.auth-in');
    const foot = document.querySelector('.foot');
    const h = Math.ceil(el.getBoundingClientRect().height + (foot ? foot.offsetHeight : 0) + (document.querySelector('.appbar')?.offsetHeight || 0));
    document.documentElement.dataset.h = h;
    if (parent !== window) parent.postMessage({h}, '*');
  };
  mark(); (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(mark);
}
